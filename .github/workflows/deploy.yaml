name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 심사 기간(9/21 ~ 10/5) 중 링크가 죽으면 심사에서 제외된다.
# 배포 전에 게이트를 전부 다시 돌려 깨진 빌드가 Pages에 올라가는 일을 막는다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: pnpm 설치
        uses: pnpm/action-setup@v6

      - name: Node 설치
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm type:check

      - name: 환경 변수 확인
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for name in VITE_API_BASE_URL VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Actions variables가 비어 있습니다:$missing"
            echo "Settings의 Secrets and variables, Actions, Variables에서 채운 뒤 다시 돌린다"
            exit 1
          fi

      - name: 빌드
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_KAKAO_JS_KEY: ${{ vars.VITE_KAKAO_JS_KEY }}
        run: pnpm build

      - name: SPA 폴백
        run: cp dist/index.html dist/404.html

      - name: 린트
        run: pnpm lint

      - name: 포맷 검사
        run: pnpm format:check

      - name: Pages 설정
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: 산출물 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
